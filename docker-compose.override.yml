services:
  postgres:
    ports:
      - '${DB_PORT}:5432'

  pgadmin:
    image: dpage/pgadmin4
    container_name: zen_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PASSWORD}
    ports:
      - '${PG_PORT}:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - zen_network

  redis:
    ports:
      - '${REDIS_PORT:-6379}:6379'

volumes:
  pgadmin_data:
